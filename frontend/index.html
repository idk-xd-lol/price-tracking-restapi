<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Price tracker API</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  </head>
  <body>
    <h1>Price tracker API</h1>
    <h2>Items count: {{ products_count }}</h2>
    <div class ="products">
      {% for id, name, img, price, rating, _rating_count, url_page in products %}
      <a href="products/{{ url_page }}_{{ id }}">
        <button class="product" type="button">
          <img class="icon" src="{{ img }}" alt="{{ name }}">
          <div>
            <h2>{{ name }}</h2>
            <p class="price">{{ price }}</p>

            {% if rating is not none %}
              <p class="rating">★ {{ rating }}</p>
            {% else %}
              <p class="rating">★  N/A</p>
            {% endif %}
          </div>
        </button>
      </a>
      {% endfor %}
    </div>
  </body>
</html>
